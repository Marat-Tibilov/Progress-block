<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Progress — circular progress block with Value, Animate and Hide controls.">
  <title>Progress</title>

  <link rel="stylesheet" href="progress.css">
  <link rel="stylesheet" href="style.css">

  <script type="module" src="main.js"></script>
</head>
<body>
  <main class="app">
    <h1 class="app__title">Progress</h1>

    <div class="app__stage">
      <div
        class="progress"
        style="--progress-value: 60"
        role="progressbar"
        aria-label="Progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="60"
      >
        <svg class="progress__ring" viewBox="0 0 100 100" focusable="false" aria-hidden="true">
          <circle class="progress__track" cx="50" cy="50" r="45" pathLength="100"></circle>
          <circle class="progress__indicator" cx="50" cy="50" r="45" pathLength="100"></circle>
        </svg>
      </div>
    </div>

    <form class="app__controls controls" autocomplete="off" novalidate>
      <fieldset class="controls__group">
        <legend class="visually-hidden">Progress controls</legend>

        <div class="controls__row">
          <input
            class="field"
            id="control-value"
            name="value"
            type="number"
            value="60"
            min="0"
            max="100"
            step="1"
            inputmode="numeric"
            enterkeyhint="done"
          >
          <label class="controls__label" for="control-value">Value</label>
        </div>

        <div class="controls__row">
          <input class="switch" id="control-animate" name="animate" type="checkbox" role="switch">
          <label class="controls__label" for="control-animate">Animate</label>
        </div>

        <div class="controls__row">
          <input class="switch" id="control-hide" name="hide" type="checkbox" role="switch">
          <label class="controls__label" for="control-hide">Hide</label>
        </div>
      </fieldset>
    </form>
  </main>
</body>
</html>
